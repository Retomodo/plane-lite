# Local dev/test services for the Go server. Production does not use this
# file: there, DATABASE_URL and REDIS_URL point at managed services.
#
#   docker compose -f docker-compose.dev.yml up -d                      # db, redis, mail
#   docker compose -f docker-compose.dev.yml --profile reference up -d  # + Django reference
#
# Parallel ports run one stack per slot (scripts/devstack.sh N up): its own
# project name and host ports, set through the PLANE_DEV_* variables below.
name: ${PLANE_DEV_PROJECT:-plane-lite-dev}

services:
  db:
    image: postgres:15.7-alpine
    environment:
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: plane
      POSTGRES_DB: plane
    # Throwaway data; durability off for fast test resets.
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./contract/reference/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    ports:
      - "127.0.0.1:${PLANE_DEV_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plane -d plane"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: valkey/valkey:7.2.11-alpine
    ports:
      - "127.0.0.1:${PLANE_DEV_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${PLANE_DEV_SMTP_PORT:-51025}:1025"
      - "127.0.0.1:${PLANE_DEV_MAILPIT_PORT:-58025}:8025"

  # Optional local S3 stand-in, only for recording and testing the file
  # asset scenarios (production stores assets in Cloudflare R2, configured
  # through AWS_*). Off by default: start it with --profile s3
  # (PLANE_DEV_S3=1 scripts/devstack.sh N up). The bucket is created at
  # startup (MINIO_DEFAULT_BUCKETS). Upstream MinIO no longer publishes
  # images; Bitnami's frozen legacy build is upstream MinIO with that
  # bucket bootstrap.
  minio:
    profiles: ["s3"]
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: plane-minio
      MINIO_ROOT_PASSWORD: plane-minio-secret
      MINIO_DEFAULT_BUCKETS: uploads
    tmpfs:
      - /bitnami/minio/data:mode=1777
    ports:
      - "127.0.0.1:${PLANE_DEV_MINIO_PORT:-59000}:9000"
    # Healthy once startup has created the bucket (anonymous requests get
    # 403 whether or not it exists, so the check signs in).
    healthcheck:
      test: ["CMD-SHELL", "mc alias set health http://localhost:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" >/dev/null && mc stat health/uploads >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Django reference implementation, used only to record contract goldens.
  reference:
    profiles: ["reference"]
    # Shared by every slot's project, so it is built once.
    image: plane-lite-reference:dev
    build:
      context: ../api
      dockerfile: Dockerfile.dev
    volumes:
      - ./contract/reference/reference_settings.py:/code/plane/settings/reference.py:ro
    environment:
      DJANGO_SETTINGS_MODULE: plane.settings.reference
      DEBUG: "0"
      SECRET_KEY: reference-secret-key-not-for-production-use-0123456789
      DATABASE_URL: postgresql://plane:plane@db:5432/plane_ref
      REDIS_URL: redis://redis:6379/1
      SKIP_ENV_VAR: "0"
      ENABLE_SIGNUP: "1"
      ENABLE_EMAIL_PASSWORD: "1"
      ENABLE_MAGIC_LINK_LOGIN: "1"
      EMAIL_HOST: mail
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "0"
      EMAIL_USE_SSL: "0"
      EMAIL_FROM: "Plane <plane@example.com>"
      WEB_URL: http://localhost:58000
      APP_BASE_URL: http://localhost:3000
      ADMIN_BASE_URL: http://localhost:3001
      SPACE_BASE_URL: http://localhost:3002
      LIVE_BASE_URL: http://localhost:3100
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      APP_VERSION: v1.4.2
      # Storage on the optional minio service (profile s3), used only when
      # recording the asset scenarios. USE_MINIO stays off: with it on, Django
      # signs URLs for the request's own host (a proxy in front of MinIO),
      # which the container can't reach for copy_object.
      USE_MINIO: "0"
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: plane-minio
      AWS_SECRET_ACCESS_KEY: plane-minio-secret
      AWS_S3_BUCKET_NAME: uploads
      AWS_REGION: us-east-1
      FILE_SIZE_LIMIT: "5242880"
    command: >
      sh -c "python manage.py migrate --noinput &&
             exec uvicorn plane.asgi:application --host 0.0.0.0 --port 8000 --workers 2"
    ports:
      - "127.0.0.1:${PLANE_DEV_REFERENCE_PORT:-58000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
